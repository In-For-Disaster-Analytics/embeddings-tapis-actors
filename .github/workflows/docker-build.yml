name: Build and push Actor images

# Mirrors label-studio-tapis-auth/.github/workflows/docker-build.yml (the
# proven GHCR pattern already used for that repo's Tapis Pod image), matrixed
# over this repo's two Actors. Each has its OWN Dockerfile as of the ls6
# split (Decision 45) -- Dockerfile.embed-generate (needs the vendored Clay
# source + a ~4.8GB checkpoint this CI checkout genuinely cannot obtain yet,
# a real, flagged, still-unresolved gap -- see that Dockerfile's own header)
# and Dockerfile.model-train (no Clay dependency at all -- builds cleanly).
# `fail-fast: false` so embed-generate's known-failing build doesn't cancel
# model-train's genuinely-succeeding one (that's exactly what happened
# before this was added: model-train failed first under the old shared
# Dockerfile, and GitHub Actions' default fail-fast cancelled embed-generate's
# job too, hiding which one was the real problem).
#
# GHCR package visibility: new packages default to PRIVATE. Abaco (Tapis
# Actors) pulls anonymously, same requirement as the Pods precedent -- after
# the first push, make each package public (repeat for model-train):
#
#   gh api --method PATCH \
#     /orgs/in-for-disaster-analytics/packages/container/embeddings-tapis-actors/visibility \
#     -f visibility=public
#
# (One GHCR package name is shared -- "embeddings-tapis-actors" -- with the
# two Actors distinguished by tag, embed-generate-latest/model-train-latest,
# not by separate package names. Visibility is a package-level setting, so
# one PATCH call covers both tags.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        actor: [embed_generate, model_train]
        include:
          - actor: embed_generate
            tag_suffix: embed-generate
            dockerfile: Dockerfile.embed-generate
          - actor: model_train
            tag_suffix: model-train
            dockerfile: Dockerfile.model-train
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.tag_suffix }}-{{sha}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.actor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.actor }}
